name: release

# Pushing a tag like v1.2.3 publishes a GitHub release with the hub and agent
# binaries and a SHA256SUMS file. Docker images for the same tag are built by
# docker.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build web UI
        run: make web
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p release
          flags="-s -w -X main.version=$VERSION"
          for p in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64; do
            os=${p%/*}; arch=${p#*/}
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$flags" -o release/pingtxt-agent-$os-$arch ./cmd/pingtxt-agent
          done
          for p in linux/amd64 linux/arm64; do
            os=${p%/*}; arch=${p#*/}
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$flags" -o release/pingtxt-$os-$arch ./cmd/pingtxt
          done
          cd release && sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
