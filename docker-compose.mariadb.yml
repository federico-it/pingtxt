# pingtxt hub + MariaDB. Start with:
#   docker compose -f docker-compose.mariadb.yml up -d
# Needs DB_PASSWORD and DB_ROOT_PASSWORD in a .env file next to this file
# before the first start (letters and digits only, or URL-encode the
# password in PINGTXT_DB_URL).
services:
  pingtxt:
    image: ghcr.io/federico-it/pingtxt:latest
    # build: .
    container_name: pingtxt
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      PINGTXT_DB_URL: mariadb://pingtxt:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:3306/pingtxt
    depends_on:
      db:
        condition: service_healthy
    # Only for "docker container" monitors on the hub location:
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    image: mariadb:11
    container_name: pingtxt-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pingtxt
      MARIADB_USER: pingtxt
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mariadb:

# IPv6: containers get no IPv6 by default, so checks to IPv6-only targets fail.
# Uncomment to enable it (Docker 27 or later, IPv6 on the server). See README "IPv6".
# networks:
#   default:
#     enable_ipv6: true
