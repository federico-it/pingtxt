# Hub (API + web UI + built-in probe) in a single container, with SQLite in ./data.
# For PostgreSQL or MariaDB see docker-compose.postgres.yml and docker-compose.mariadb.yml.
services:
  pingtxt:
    image: ghcr.io/federico-it/pingtxt:latest
    # build: .
    container_name: pingtxt
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data:/data
      # Only for "docker container" monitors on the hub location:
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    # Public URL, login providers (GitHub, Google, OIDC) and the other settings
    # are configured in the web UI: settings.

  # Optional: an agent on another machine. Create it in the UI (agents > add agent)
  # and paste the token here.
  # pingtxt-agent:
  #   image: ghcr.io/federico-it/pingtxt-agent:latest
  #   restart: unless-stopped
  #   cap_add: [NET_RAW]
  #   environment:
  #     PINGTXT_HUB: https://status.example.com
  #     PINGTXT_TOKEN: pt_xxx
